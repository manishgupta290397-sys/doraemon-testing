<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Doraemon Backend Tester</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1d29;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --danger: #dc2626;
    --danger-2: #b91c1c;
    --success: #16a34a;
    --border: #e5e7eb;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #eef2ff;
    --bubble-bot-text: #1a1d29;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --card: #1a1d29;
      --text: #f1f2f6;
      --muted: #9aa0ac;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --border: #2a2e3a;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-bot: #262a38;
      --bubble-bot-text: #f1f2f6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #f1f2f6;
    --muted: #9aa0ac;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --border: #2a2e3a;
    --bubble-user: #3b82f6;
    --bubble-user-text: #ffffff;
    --bubble-bot: #262a38;
    --bubble-bot-text: #f1f2f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header {
    padding: 16px 16px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .settings {
    margin: 0 16px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  .settings summary {
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    user-select: none;
  }
  .settings-body {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .settings label {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
  }
  .settings input[type="text"] {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.85rem;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }
  .empty-state .emoji {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 0.85rem;
    line-height: 1.5;
    max-width: 260px;
    margin: 0 auto;
  }

  .bubble-row {
    display: flex;
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }
  .bubble.bot .tag {
    display: block;
    font-size: 0.68rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }
  .bubble.error {
    background: #fee2e2;
    color: #991b1b;
    border-bottom-left-radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bubble.error {
      background: #3f1616;
      color: #fca5a5;
    }
  }
  :root[data-theme="dark"] .bubble.error {
    background: #3f1616;
    color: #fca5a5;
  }

  .meta-line {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }

  .command-chip {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.12);
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
  }

  footer {
    flex-shrink: 0;
    padding: 10px 16px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }

  .status-line {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    min-height: 1.1em;
  }
  .status-line.recording { color: var(--danger); font-weight: 600; }
  .status-line.busy { color: var(--accent); font-weight: 600; }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .text-fallback {
    flex: 1;
    display: flex;
    gap: 8px;
  }
  .text-fallback input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
  }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .mic-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mic-btn.recording {
    background: var(--danger);
    box-shadow: 0 3px 14px rgba(220, 38, 38, 0.45);
    transform: scale(1.08);
    animation: pulse 1.2s infinite;
  }
  .mic-btn:disabled { opacity: 0.5; cursor: default; }

  .upload-btn {
    width: 46px;
    height: 46px;
    font-size: 1.15rem;
    background: var(--bubble-bot);
    color: var(--accent);
    box-shadow: none;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45); }
    70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
  }

  .mode-toggle {
    text-align: center;
    margin-top: 10px;
  }
  .mode-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.75rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🤖 Doraemon Backend Tester</h1>
  <p>Talk to your robot's brain directly — no ESP32 needed</p>
</header>

<details class="settings" id="settingsPanel">
  <summary>⚙️ Backend settings</summary>
  <div class="settings-body">
    <div>
      <label for="endpointInput">Backend base URL</label>
      <input type="text" id="endpointInput" placeholder="https://your-repl.replit.app" />
    </div>
    <div class="settings-row">
      <span id="urlStatus">Enter your Replit backend URL above, then close this panel.</span>
    </div>
  </div>
</details>

<main id="chatArea">
  <div class="empty-state" id="emptyState">
    <span class="emoji">🎙️</span>
    <p>Tap the mic and say something like "hi" or "move forward" — or type a message below. Doraemon's reply will show up here.</p>
  </div>
</main>

<footer>
  <div class="status-line" id="statusLine"></div>
  <div class="controls" id="voiceControls">
    <button class="mic-btn" id="micBtn" title="Hold to record">🎤</button>
    <button class="mic-btn upload-btn" id="uploadBtn" title="Upload an audio/video file">📁</button>
    <div class="text-fallback">
      <input type="text" id="textInput" placeholder="...or type a message" />
      <button class="send-btn" id="sendTextBtn">➤</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="audio/*,video/mp4,.mp4,.m4a,.wav,.mp3,.webm" class="hidden" />
  <div class="mode-toggle">
    <button id="clearChatBtn">Clear conversation</button>
  </div>
</footer>

<script>
(function () {
  const chatArea = document.getElementById('chatArea');
  const emptyState = document.getElementById('emptyState');
  const micBtn = document.getElementById('micBtn');
  const statusLine = document.getElementById('statusLine');
  const endpointInput = document.getElementById('endpointInput');
  const urlStatus = document.getElementById('urlStatus');
  const settingsPanel = document.getElementById('settingsPanel');
  const textInput = document.getElementById('textInput');
  const sendTextBtn = document.getElementById('sendTextBtn');
  const clearChatBtn = document.getElementById('clearChatBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');

  const STORAGE_KEY = 'doraemon_tester_backend_url';

  function loadSavedUrl() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        endpointInput.value = saved;
        settingsPanel.removeAttribute('open');
        urlStatus.textContent = 'Using saved backend URL.';
      }
    } catch (e) {
      // localStorage unavailable, ignore
    }
  }

  function saveUrl(url) {
    try {
      localStorage.setItem(STORAGE_KEY, url);
    } catch (e) {
      // ignore storage failures
    }
  }

  function getBaseUrl() {
    let url = endpointInput.value.trim();
    if (!url) return null;
    if (url.endsWith('/')) url = url.slice(0, -1);
    saveUrl(url);
    return url;
  }

  loadSavedUrl();

  endpointInput.addEventListener('change', () => {
    const url = getBaseUrl();
    urlStatus.textContent = url ? 'Backend URL saved on this device.' : 'Enter your Replit backend URL above.';
  });

  function clearEmptyState() {
    if (emptyState && emptyState.parentNode) {
      emptyState.remove();
    }
  }

  function addBubble(role, text, opts) {
    opts = opts || {};
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (opts.error ? 'error' : role);

    if (role === 'bot' && !opts.error) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'Doraemon';
      bubble.appendChild(tag);
    }

    const textNode = document.createElement('span');
    textNode.textContent = text;
    bubble.appendChild(textNode);

    if (opts.commandType && opts.commandType !== 'none') {
      const chip = document.createElement('span');
      chip.className = 'command-chip';
      chip.textContent = '⚙ command: ' + opts.commandType +
        (opts.direction ? ' (' + opts.direction + ')' : '');
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(chip);
    }

    row.appendChild(bubble);
    chatArea.appendChild(row);

    if (opts.meta) {
      const meta = document.createElement('div');
      meta.className = 'meta-line';
      meta.style.textAlign = role === 'user' ? 'right' : 'left';
      meta.textContent = opts.meta;
      chatArea.appendChild(meta);
    }

    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function setStatus(text, mode) {
    statusLine.textContent = text || '';
    statusLine.className = 'status-line' + (mode ? ' ' + mode : '');
  }

  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // speech synthesis not available, silently skip
    }
  }

  async function pollJobStatus(baseUrl, jobId, maxAttempts) {
    maxAttempts = maxAttempts || 20; // ~20 seconds of polling before giving up
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
      try {
        const resp = await fetch(baseUrl + '/listen/status?job_id=' + encodeURIComponent(jobId));
        const data = await resp.json();

        if (data.status === 'pending') {
          continue; // keep polling
        }
        return { ok: resp.ok, data };
      } catch (err) {
        return { ok: false, data: { error: 'Could not reach backend while polling: ' + err.message } };
      }
    }
    return { ok: false, data: { error: 'Timed out waiting for a reply.' } };
  }

  async function sendToListen(blob, mimeType, label) {
    const baseUrl = getBaseUrl();
    if (!baseUrl) {
      addBubble('bot', 'Please set your backend URL in the settings panel above first.', { error: true });
      settingsPanel.setAttribute('open', 'true');
      return;
    }

    addBubble('user', label || '🎤 (voice message)');
    setStatus('Uploading...', 'busy');
    micBtn.disabled = true;
    uploadBtn.disabled = true;
    sendTextBtn.disabled = true;

    try {
      const resp = await fetch(baseUrl + '/listen', {
        method: 'POST',
        headers: { 'Content-Type': mimeType || 'audio/webm' },
        body: blob,
      });
      const data = await resp.json();

      if (!resp.ok) {
        addBubble('bot', data.error || ('Server error (' + resp.status + ')'), { error: true });
        return;
      }

      // New async flow: /listen instantly returns a job_id and a
      // pre-programmed "thinking" message, then the real answer is
      // fetched separately via polling /listen/status.
      if (data.status === 'pending' && data.job_id) {
        if (data.message) addBubble('bot', data.message);
        setStatus('Doraemon is thinking...', 'busy');

        const result = await pollJobStatus(baseUrl, data.job_id);
        if (!result.ok) {
          addBubble('bot', result.data.error || 'Something went wrong while waiting for a reply.', { error: true });
          return;
        }

        const finalData = result.data;
        if (finalData.status === 'error') {
          addBubble('bot', finalData.error || 'Transcription or reply failed.', { error: true });
          return;
        }

        if (finalData.heard) {
          const heardRow = document.createElement('div');
          heardRow.className = 'meta-line';
          heardRow.style.textAlign = 'right';
          heardRow.textContent = 'Heard: "' + finalData.heard + '"';
          chatArea.appendChild(heardRow);
        }
        const cmd = finalData.command || {};
        addBubble('bot', finalData.response || '(no reply text)', {
          commandType: cmd.type,
          direction: cmd.direction,
        });
        if (finalData.response) speak(finalData.response);
        return;
      }

      // Fallback: older synchronous /listen shape (in case the backend
      // hasn't been updated to the async job version yet).
      if (data.heard) {
        const heardRow = document.createElement('div');
        heardRow.className = 'meta-line';
        heardRow.style.textAlign = 'right';
        heardRow.textContent = 'Heard: "' + data.heard + '"';
        chatArea.appendChild(heardRow);
      }
      const cmd = data.command || {};
      addBubble('bot', data.response || '(no reply text)', {
        commandType: cmd.type,
        direction: cmd.direction,
      });
      if (data.response) speak(data.response);
    } catch (err) {
      addBubble('bot', 'Could not reach backend: ' + err.message, { error: true });
    } finally {
      setStatus('');
      micBtn.disabled = false;
      uploadBtn.disabled = false;
      sendTextBtn.disabled = false;
    }
  }

  async function sendTextMessage(message) {
    const baseUrl = getBaseUrl();
    if (!baseUrl) {
      addBubble('bot', 'Please set your backend URL in the settings panel above first.', { error: true });
      settingsPanel.setAttribute('open', 'true');
      return;
    }

    addBubble('user', message);
    setStatus('Doraemon is thinking...', 'busy');
    micBtn.disabled = true;
    sendTextBtn.disabled = true;

    try {
      const resp = await fetch(baseUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        addBubble('bot', data.error || ('Server error (' + resp.status + ')'), { error: true });
      } else {
        const cmd = data.command || {};
        addBubble('bot', data.response || '(no reply text)', {
          commandType: cmd.type,
          direction: cmd.direction,
        });
        if (data.response) speak(data.response);
      }
    } catch (err) {
      addBubble('bot', 'Could not reach backend: ' + err.message, { error: true });
    } finally {
      setStatus('');
      micBtn.disabled = false;
      sendTextBtn.disabled = false;
    }
  }

  // ---------- Recording logic ----------
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let stream = null;

  async function startRecording() {
    const isSecure = window.isSecureContext;
    if (!isSecure) {
      addBubble(
        'bot',
        'Mic access needs a secure page (https://) or a localhost page — a file opened directly from your downloads/storage won\'t be allowed to use the microphone. Use the "📁 Upload" button instead to pick a pre-recorded audio/video file, or open this page from its https link.',
        { error: true }
      );
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addBubble('bot', 'This browser does not support microphone recording. Try the "📁 Upload" button instead.', { error: true });
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      let msg = 'Microphone access failed: ' + err.name + '.';
      if (err.name === 'NotAllowedError') {
        msg = 'Microphone permission was denied. Check your browser\'s site settings (tap the lock/info icon next to the address bar → Permissions → Microphone → Allow), then try again. You can also use the "📁 Upload" button to send a pre-recorded file instead.';
      } else if (err.name === 'NotFoundError') {
        msg = 'No microphone was found on this device.';
      }
      addBubble('bot', msg, { error: true });
      setStatus('');
      return;
    }

    audioChunks = [];
    let mimeType = 'audio/webm';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        mimeType = 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        mimeType = 'audio/mp4';
      }
    }

    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
    } catch (e) {
      mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      const finalType = mediaRecorder.mimeType || mimeType;
      const blob = new Blob(audioChunks, { type: finalType });
      if (blob.size > 0) {
        sendToListen(blob, finalType);
      } else {
        setStatus('No audio captured — try again.', 'recording');
        setTimeout(() => setStatus(''), 1800);
      }
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    setStatus('Recording... tap again to stop', 'recording');
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
    }
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  }

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  function guessMimeType(file) {
    if (file.type) return file.type;
    const name = file.name.toLowerCase();
    if (name.endsWith('.mp4')) return 'audio/mp4';
    if (name.endsWith('.m4a')) return 'audio/mp4';
    if (name.endsWith('.wav')) return 'audio/wav';
    if (name.endsWith('.mp3')) return 'audio/mpeg';
    if (name.endsWith('.webm')) return 'audio/webm';
    if (name.endsWith('.ogg')) return 'audio/ogg';
    return 'application/octet-stream';
  }

  uploadBtn.addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    const mimeType = guessMimeType(file);
    sendToListen(file, mimeType, '📁 ' + file.name);
  });

  sendTextBtn.addEventListener('click', () => {
    const msg = textInput.value.trim();
    if (!msg) return;
    textInput.value = '';
    sendTextMessage(msg);
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      sendTextBtn.click();
    }
  });

  clearChatBtn.addEventListener('click', () => {
    chatArea.innerHTML = '';
    const fresh = document.createElement('div');
    fresh.className = 'empty-state';
    fresh.id = 'emptyState';
    fresh.innerHTML = '<span class="emoji">🎙️</span><p>Tap the mic and say something like "hi" or "move forward" — or type a message below. Doraemon\'s reply will show up here.</p>';
    chatArea.appendChild(fresh);
  });
})();
</script>

</body>
</html>
